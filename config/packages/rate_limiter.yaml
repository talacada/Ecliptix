framework:
    rate_limiter:
        login_limiter:
            policy: 'token_bucket'
            limit: 5
            rate: { amount: 5, interval: '1 minute' }
        register_limiter:
            policy: 'token_bucket'
            limit: 3
            rate: { amount: 3, interval: '1 minute' }
        password_reset_limiter:
            policy: 'token_bucket'
            limit: 3
            rate: { amount: 3, interval: '1 minute' }
when@test:
    framework:
        rate_limiter:
            login_limiter:
                policy: 'no_limit'
            register_limiter:
                policy: 'no_limit'
            password_reset_limiter:
                policy: 'no_limit'
